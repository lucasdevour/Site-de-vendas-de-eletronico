<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hagon Store</title>
    
    
    
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js';
        import { getFirestore, doc, setDoc } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js';

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAhPVplbeCbaQFy-4Oi9KEmsZaAYHO7i9Y",
            authDomain: "hagon-store.firebaseapp.com",
            projectId: "hagon-store",
            storageBucket: "hagon-store.firebasestorage.app",
            messagingSenderId: "681640518412",
            appId: "1:681640518412:web:e55ba45b33d999e1f81f29",
            measurementId: "G-XH6TJX5XNS"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.setDoc = setDoc;
        window.doc = doc;
    </script>
    <link rel="stylesheet" href="../design/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="header-logo">
        <a href="../index.html">
            <img src="../assets/logo.png" alt="Hagon Store" class="logo-img">
        </a>
    </div>

    <header class="header-gamma">
        <div class="container-header">
            
            <div class="header-busca">
                <form action="#">
                    <input type="text" id="busca-header" name="busca" placeholder="Buscar na Hagon Store..." autocomplete="off">
                    <button type="submit" class="btn-lupa">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </form>
            </div>

            <div class="header-usuario">
                <div class="usuario-perfil">
                    <div class="icone-user-bw">
                        <i class="fa-regular fa-circle-user"></i>
                    </div>
                    <div class="usuario-links">
                        <a href="cadastro.html" class="link-nav">Cadastre-se</a>
                        <span class="divisor-v">|</span>
                        <a href="login.html" class="link-login">Fazer login</a>
                    </div>
                </div>

                
                <div class="carrinho-box-bw">
                    <span class="icone-sacola-bw">
                        <i class="fa-solid fa-cart-shopping"></i>
                    </span>
                    <span class="contador-carrinho-bw">0</span>
                </div>
            </div>
        </div>

        <nav class="nav-categorias">
            <a href="../index.html" class="link-nav">Inicio</a>
            <a href="#">Lançamentos</a>
            <a href="#">Caixas de Som</a>
            <a href="#">Fones de Ouvido</a>
            <a href="#">Gamer</a>
            <a href="#">Carregadores</a>
            <a href="#">Smartwatch</a>
            <a href="#">Acessoriós</a>
        </nav>
    </header>

    <main class="container-auth">
        <div class="card-auth">
            <div class="cabecalho-form">
                <h2>CRIAR MINHA CONTA</h2>
                <p>Informe os seus dados abaixo para criar sua conta.</p>
            </div>

            <form id="form-cadastro" class="form-auth">
                <div class="duas-colunas">
                    <div class="grupo-input">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" placeholder="Ex: João" autocomplete="given-name" required>
                    </div>
                    <div class="grupo-input">
                        <label for="sobrenome">Sobrenome</label>
                        <input type="text" id="sobrenome" name="sobrenome" placeholder="Ex: Silva" autocomplete="family-name" required>
                    </div>
                </div>

                <div class="grupo-input">
                    <label for="tipoPessoa">Quero me cadastrar como: *</label>
                    <select id="tipoPessoa" name="tipoPessoa" class="input-hagon" autocomplete="off">
                        <option value="fisica">Pessoa Física</option>
                        <option value="juridica">Pessoa Jurídica</option>
                    </select>
                </div>

                <div class="duas-colunas">
                    <div class="grupo-input">
                        <label for="documento" id="labelDocumento">CPF *</label>
                        <input type="text" id="documento" name="documento" placeholder="000.000.000-00" autocomplete="cc-number" required>
                    </div>
                </div>

                <div class="grupo-input">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required>
                </div>

                <div class="grupo-input">
                    <label for="senha">Senha *</label>
                    <input type="password" id="senha" name="senha" placeholder="Crie uma senha forte" autocomplete="new-password" required>
                </div>

                <div class="grupo-checkbox">
                    <label class="container-check" for="marketing">
                        <input type="checkbox" id="marketing" name="marketing">
                        <span class="checkmark"></span>
                        Aceito receber comunicação de marketing da Hagon Store
                    </label>
                    
                    <label class="container-check" for="termos">
                        <input type="checkbox" id="termos" name="termos" required>
                        <span class="checkmark"></span>
                        Estou ciente e CONCORDO com os <a href="#">termos de aceite</a> e <a href="#">políticas de privacidade</a>.
                    </label>
                </div>

                <button type="submit" class="btn-auth">CRIAR MINHA CONTA</button>
                <div id="cadastroErro" class="erro-mensagem" style="color:var(--primary); margin-top:12px; text-align:left;"></div>
                <div class="voltar-login">
                    <a href="login.html">Voltar para o login</a>
                </div>
            </form>
        </div>
    </main>

    <div id="modal-sucesso" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="background: var(--bg-card); padding: 40px; border-radius: 20px; border: 1px solid var(--primary); text-align: center;">
            <div class="modal-icon" style="font-size: 3rem; margin-bottom: 20px;">✅</div>
            <h2 style="color: #fff;">Cadastro realizado!</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Seja bem-vindo à Hagon Store. Vamos preparar o seu acesso.</p>
            <button class="btn-auth" onclick="irParaLogin()">Ir para o Login</button>
        </div>
    </div>
    
    <script src="../logic/script.js"></script>
</body>
</html>
