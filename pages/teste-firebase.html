<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Firebase - Hagon Store</title>
</head>
<body>
    <h1>Teste de Configuração Firebase</h1>
    <div id="status">Verificando...</div>
    <button onclick="testarFirebase()">Testar Firebase</button>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
        import { getAuth } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js';

        // Firebase Config (substitua pelos seus valores)
        const firebaseConfig = {
            apiKey: "AIzaSyAhPVplbeCbaQFy-4Oi9KEmsZaAYHO7i9Y",
            authDomain: "hagon-store.firebaseapp.com",
            projectId: "hagon-store",
            storageBucket: "hagon-store.firebasestorage.app",
            messagingSenderId: "681640518412",
            appId: "1:681640518412:web:e55ba45b33d999e1f81f29",
            measurementId: "G-XH6TJX5XNS"
        };

        let auth = null;

        function testarFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                document.getElementById('status').innerHTML = '✅ Firebase configurado com sucesso!';
                document.getElementById('status').style.color = 'green';
            } catch (error) {
                document.getElementById('status').innerHTML = '❌ Erro na configuração: ' + error.message;
                document.getElementById('status').style.color = 'red';
            }
        }

        // Teste automático
        window.onload = testarFirebase;
    </script>
</body>
</html>
